# API parity cases. Every case starts from the seed data (POST /api/test/reset)
# and runs its steps in order. `modernize lock` records the legacy responses
# into golden/, and `modernize verify` replays the same steps against the new
# backend and compares every field.
#
# `covers` lists the parity/behaviour.yaml items the case tests.
#
# Step formats:
#   - GET /api/expenses                          plain request
#   - POST /api/expenses: {title: ..., ...}      request with a JSON body
#   - {request: POST /api/expenses, raw: "x"}    request with a raw (non-JSON) body

cases:
  list_expenses:
    covers: [B1]
    steps:
      - GET /api/expenses

  summary:
    covers: [B4, B5, B6, B7]
    steps:
      - GET /api/summary

  add_valid_then_summary:
    covers: [B2, B4, B5]
    steps:
      - POST /api/expenses: {title: "Taxi home", amount: 350, category: Travel, date: "2026-09-27"}
      - GET /api/expenses
      - GET /api/summary

  add_missing_title:
    covers: [B2]
    steps:
      - POST /api/expenses: {amount: 350, category: Travel, date: "2026-09-27"}

  add_blank_title:
    covers: [B2]
    steps:
      - POST /api/expenses: {title: "   ", amount: 350, category: Travel, date: "2026-09-27"}

  add_zero_amount:
    covers: [B2]
    steps:
      - POST /api/expenses: {title: "Refund", amount: 0, category: Food, date: "2026-09-27"}

  add_decimal_amount:
    covers: [B2]
    steps:
      - POST /api/expenses: {title: "Snacks", amount: 12.5, category: Food, date: "2026-09-27"}

  add_unknown_category:
    covers: [B2]
    steps:
      - POST /api/expenses: {title: "Rent", amount: 9000, category: Rent, date: "2026-09-27"}

  add_bad_date:
    covers: [B2]
    steps:
      - POST /api/expenses: {title: "Taxi home", amount: 350, category: Travel, date: "27/09/2026"}

  add_non_json_body:
    covers: [B2]
    steps:
      - {request: POST /api/expenses, raw: "title=Taxi", content_type: "text/plain"}

  delete_then_list_and_summary:
    covers: [B3, B4, B5]
    steps:
      - DELETE /api/expenses/2
      - GET /api/expenses
      - GET /api/summary

  delete_missing:
    covers: [B3]
    steps:
      - DELETE /api/expenses/999

  summary_of_empty_store:
    covers: [B8]
    steps:
      - DELETE /api/expenses/1
      - DELETE /api/expenses/2
      - DELETE /api/expenses/3
      - DELETE /api/expenses/4
      - DELETE /api/expenses/5
      - DELETE /api/expenses/6
      - DELETE /api/expenses/7
      - DELETE /api/expenses/8
      - DELETE /api/expenses/9
      - DELETE /api/expenses/10
      - DELETE /api/expenses/11
      - GET /api/summary
