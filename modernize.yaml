# modernize.yaml -- where things live and how to start them.
# The CLI reads this file; edit it to point the pipeline at a different app.

project: Expense Tracker

paths:
  legacy_backend: legacy/backend
  legacy_frontend: legacy/frontend
  modern_backend: modern/backend
  modern_frontend: modern/frontend
  hybrid_frontend: out/hybrid

# Long-running services. "{python}" is the Python running this CLI.
services:
  legacy-api:
    # Python 2.7 runs in Docker. To use a local Python 2.7 instead, set
    # MODERNIZE_LEGACY_API_START (see README, "Running without Docker").
    start: docker compose up -d --build legacy-api
    stop: docker compose stop legacy-api
    detached: true
    ready_url: http://localhost:5001/api/expenses
  modern-api:
    start: "{python} app.py"
    cwd: modern/backend
    env: { PORT: "5002", TEST_HOOKS: "1" }
    ready_url: http://localhost:5002/api/expenses
  modern-web:
    start: npm run dev -- --port 5173 --strictPort
    cwd: modern/frontend
    ready_url: http://localhost:5173/
  hybrid-web:
    start: "{python} -m modernize.static_proxy --root out/hybrid --api http://localhost:5002 --port 8081"
    ready_url: http://localhost:8081/

# A target is one runnable version of the app.
targets:
  legacy:
    services: [legacy-api]
    api_url: http://localhost:5001
    web_url: http://localhost:5001
  modern:
    services: [modern-api, modern-web]
    api_url: http://localhost:5002
    web_url: http://localhost:5173
  hybrid:
    services: [modern-api, hybrid-web]
    api_url: http://localhost:5002
    web_url: http://localhost:8081

# The AI steps run Claude Code headless (`claude -p`). The pipeline owns the retry loop.
ai:
  model: claude-sonnet-5          # or claude-opus-5-5; override with MODERNIZE_MODEL
  max_attempts: 3                 # per step; then the pipeline stops (override: MODERNIZE_MAX_ATTEMPTS)
  budget_per_attempt_usd: 1.00    # Claude Code --max-budget-usd (override: MODERNIZE_BUDGET_USD)
