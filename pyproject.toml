[project]
name = "modernize"
version = "0.1.0"
description = "Legacy modernization pipeline: open-source tools do the bulk, AI fills the gaps, parity tests decide."
readme = "README.md"
# Python 3.12 or newer. The Python 2 syntax codemod is fissix (2to3's fixers, packaged
# separately), so it no longer depends on the 2to3 that Python 3.13 removed.
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "requests>=2.32",
  "pytest>=8",
  "coverage>=7.6",
  "flask>=3.1,<4",
  "ruff==0.16.9",
  "fissix==24.4.24",
  "semgrep==1.178.0",
]

[project.scripts]
modernize = "modernize.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modernize"]

[tool.pytest.ini_options]
testpaths = ["parity/api"]
addopts = "-q -p no:cacheprovider"
